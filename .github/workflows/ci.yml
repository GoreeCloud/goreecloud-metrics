name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      METRICS_ENV: test
      METRICS_SECRET_KEY: ci-test-only-key-not-for-production
      METRICS_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      METRICS_SQLITE_PATH: /tmp/goreecloud-metrics-ci.sqlite3
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate repository structure
        run: python scripts/validate_repository.py

      - name: Compile Python source
        run: python -m compileall -q manage.py src tests scripts

      - name: Run Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test tests -v 2

      - name: Run production-oriented Django deployment checks
        env:
          METRICS_ENV: production
          METRICS_SECRET_KEY: ci-only-production-check-key-012345678901234567890123456789
          METRICS_ALLOWED_HOSTS: metrics.invalid
          METRICS_SQLITE_PATH: /tmp/goreecloud-metrics-deploy-check.sqlite3
        run: python manage.py check --deploy
